[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flu-fleet"
version = "0.1.0"
description = "Конвейер прошивки и обслуживания роботов FLU"
requires-python = ">=3.11"
dependencies = [
    "Jinja2~=3.1",
    "ruamel.yaml~=0.19.1",
    "cryptography>=44",
    "paramiko~=5.1",
    "pymavlink~=2.4.50",
    "pyserial~=3.5",  # pymavlink открывает COM-порты через него, UI показывает список портов
    "requests~=2.34",
]

[project.optional-dependencies]
dev = ["pytest>=8", "aiohttp~=3.14", "PyYAML~=6.0"]

[project.scripts]
fleet = "fleet.cli:main"

[tool.setuptools.packages.find]
include = ["fleet*"]

[tool.setuptools.package-data]
fleet = ["ui.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
