[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flu-fleet"
dynamic = ["version"]  # з fleet/__init__.py: __version__
description = "Конвеєр прошивки та обслуговування НРК FLU"
# <3.15: під 3.15 ще немає готових збірок pymavlink і PyYAML для Windows
requires-python = ">=3.11,<3.15"
dependencies = [
    "Jinja2~=3.1",
    "ruamel.yaml~=0.19.1",
    "cryptography>=44",
    "paramiko~=5.1",
    "pymavlink~=2.4.50",
    "pyserial~=3.5",  # pymavlink відкриває COM-порти через нього, UI показує список портів
    "requests~=2.34",
    "pywebview>=6,<7; sys_platform == 'win32'",  # власне вікно майстра (fleet app) на WebView2
]

[project.optional-dependencies]
dev = ["pytest>=8", "aiohttp~=3.14", "PyYAML~=6.0"]
docs = ["playwright>=1.40"]  # docs/tools/screens.py: скріншоти для docs/flow.md
build = ["pyinstaller>=6.20,<7"]  # build-exe.cmd: окрема програма без Python

[project.scripts]
fleet = "fleet.cli:main"

[tool.setuptools.dynamic]
version = {attr = "fleet.__version__"}

[tool.setuptools.packages.find]
include = ["fleet*"]

[tool.setuptools.package-data]
fleet = ["ui.html", "simple.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
