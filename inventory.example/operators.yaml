# Пілоти (оператори) managed-майданчиків.
#   id    — адреса пілота в мережі operators майданчика (1..254)
#   role  — operator: керує своїми НРК і передає їх;
#           dispatcher: додатково може примусово забрати НРК
#   sites — до яких майданчиків пілот має доступ
#
# Пілота цього ноутбука додає майстер першого налаштування (fleet setup).
# Арбітр визначає пілота за адресою в тунелі WireGuard, тому в кожного
# свій ключ (fleet render видає конфіг у build/sites/<майданчик>/operators/).
#
# Приклад:
#   - name: operator1
#     id: 11
#     role: operator
#     sites: [main]
operators:
