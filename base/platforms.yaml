# Ревізії заліза. Усе, що однакове в НРК однієї ревізії, живе тут,
# а не в шаблонах: порти MikroTik, спосіб підключення ФК, камери, батарея.
#
# Внутрішня мережа однакова на всіх НРК (див. README):
#   192.168.88.1   MikroTik
#   192.168.88.2   польотний контролер / мережевий адаптер ФК
#   192.168.88.8   камера 1
#   192.168.88.9   камера 2
#   192.168.88.100-199  DHCP (ноутбук на стенді тощо)

platforms:
  flu-v1:
    description: Шасі 4 x 1 кВт, ArduPilot Rover, MikroTik, 2 IP-камери, Starlink

    # WAN: Starlink на ether1 (роздає адресу по DHCP) або USB/miniPCIe LTE-модем у самому MikroTik
    wan: {type: ethernet, interface: ether1}
    # wan: {type: lte, interface: lte1, apn: internet}

    # Який пристрій у який порт MikroTik. Порти камер важливі: за ними
    # fleet bench cameras розрізняє камери з однаковою заводською IP.
    ports: {fc: ether2, cam1: ether3, cam2: ether4, bench: ether5}

    fc:
      # serial-bridge — UART ФК через мережевий адаптер (адаптер у режимі TCP-сервера на 192.168.88.2)
      # ardupilot-net — Ethernet у самому ФК (Pixhawk 6X, CubeRed тощо), ArduPilot 4.5+
      link: serial-bridge
      mavlink_port: 5760              # TCP-порт MAVLink на 192.168.88.2
      serial: {port: 2, baud: 115}    # SERIALn і код швидкості ArduPilot (115 = 115200), для serial-bridge
      # Імена параметрів MAVLink у прошивці:
      #   legacy — SYSID_THISMAV / SYSID_MYGCS / SYSID_ENFORCE (ArduPilot до 4.6 включно)
      #   mav    — MAV_SYSID / MAV_GCS_SYSID / MAV_OPTIONS (свіжі прошивки)
      param_names: legacy

    failsafe:
      gcs_timeout_s: 5      # FS_GCS_TIMEOUT: скільки секунд без heartbeat від власника до failsafe
      action: 2             # FS_ACTION: 2 = Hold

    cameras:
      vendor: hikvision     # hikvision | dahua
      factory_ip: 192.168.1.64
      factory_user: admin
      # Нові камери потребують активації (задати пароль) через SADP / ConfigTool.
      # Активуйте їх паролем, який видав fleet provision, тоді скрипт сам змінить IP.
      rtsp_user: admin
      rtsp_path: /Streaming/Channels/102   # додатковий потік: він легший для LTE
      # dahua: /cam/realmonitor?channel=1&subtype=1

    battery: {min_v: 42.0, max_v: 58.8}   # для приймального тесту

    modes: {hold: 4}        # номер режиму HOLD в ArduPilot Rover
