# Майданчики: куди підключаються НРК.
#
#   kind: hub      — наш сервер, налаштований однією командою з програми (лише WireGuard):
#                    пілоти ходять до НРК напряму через сервер. Адресу, ключ сервера й мережі
#                    програма записує сюди сама, коли пілот вставить відповідь сервера.
#   kind: managed  — сервер із нашим стеком (WireGuard + MediaMTX + арбітр).
#                    Це наш VPS (сценарій 1) або VPS замовника, який обслуговуємо ми (сценарій 2).
#   kind: external — сервер замовника (сценарій 3): ми лише підлаштовуємо НРК під його тунель
#                    і видаємо файли підключення (fleet kit).
#
# Мережі майданчика. Не повинні перетинатися між собою, з іншими майданчиками,
# із внутрішньою мережею НРК 192.168.88.0/24 і з CGNAT операторів 100.64.0.0/10:
#   tunnel     — адреси WireGuard: сервер .1, НРК зі slot N — .(1 + N)
#   operators  — адреси операторів: оператор з id K — .K (лише managed)
#   robot_lans — по блоку /28 на НРК: сюди через netmap видно мережу НРК 192.168.88.0/28
#
# endpoint — краще DNS-ім'я, а не IP: тоді майданчик можна перенести на інший сервер,
# не чіпаючи НРК (перенесли стек разом із ключами, змінили DNS). IP теж працює.

sites:
  # Наш сервер. Заповнюється сам після вставки відповіді сервера в програмі.
#  main:
#    kind: hub
#    customer: FLU
#    host: 13.50.196.138             # приклад; програма замінить справжньою адресою
#    endpoint: 13.50.196.138:51820   # куди підключаються НРК і пілоти (UDP)
#    network:
#      tunnel: 10.150.0.0/24
#      operators: 10.150.1.0/24
#      robot_lans: 10.150.16.0/20

# Приклади інших сценаріїв: розкоментуйте й підставте свої дані.
#
#  customer-vps:                    # сценарій 2: VPS замовника, стек ставимо й обслуговуємо ми
#    kind: managed
#    customer: Замовник
#    host: robots.customer.example
#    ssh_user: root
#    endpoint: robots.customer.example:51820
#    network:
#      tunnel: 10.160.0.0/24
#      operators: 10.160.1.0/24
#      robot_lans: 10.160.16.0/20
#
#  customer-own:                    # сценарій 3: власний сервер замовника, лише тунель
#    kind: external
#    customer: Замовник
#    vpn: wireguard
#    endpoint: vpn.customer.example:51820
#    server_pubkey: "<відкритий ключ WireGuard їхнього сервера>"
#    server_ip: 172.20.5.1          # адреса їхнього сервера в тунелі
#    allowed_sources: [172.20.5.1]  # кому НРК дозволяє MAVLink і RTSP
#    network:
#      tunnel: 172.20.5.0/26        # мережі виділяє замовник
#      robot_lans: 172.20.5.64/26
#
# Сервісний тунель до нас: лише керування MikroTik (ssh, winbox) та оновлення.
# Відео й телеметрія ним не йдуть. Вмикається в НРК прапорцем service_tunnel.
#
# service:
#   host: ops.example.com
#   ssh_user: root
#   endpoint: ops.example.com:51900
#   network: 10.99.0.0/16           # .0.1 — сервер, інженер з id K — .0.(1 + K), НРК — за глобальним id
#   engineers:
#     - {name: engineer1, id: 1}
#    server_pubkey: rXpsMwtpJjl1ZzD6oa6C91k+iqrr3JpUQZNJnd7/dU8=
