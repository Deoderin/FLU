# Площадки: куда подключаются роботы.
#
#   kind: managed  — сервер с нашим стеком (WireGuard + MediaMTX + арбитр).
#                    Это наш VPS (сценарий 1) или VPS заказчика, который обслуживаем мы (сценарий 2).
#   kind: external — сервер заказчика (сценарий 3): мы только подстраиваем робота под его туннель
#                    и выдаём интеграционный пакет (fleet kit).
#
# Сети площадки. Не должны пересекаться между собой, с другими площадками,
# с внутренней сетью робота 192.168.88.0/24 и с CGNAT операторов 100.64.0.0/10:
#   tunnel     — адреса WireGuard: сервер .1, робот со slot N — .(1 + N)
#   operators  — адреса операторов: оператор с id K — .K (только managed)
#   robot_lans — по блоку /28 на робота: сюда через netmap видна сеть робота 192.168.88.0/28
#
# endpoint — всегда DNS-имя, не IP: тогда площадку можно перенести на другой сервер,
# не трогая роботов (перенесли стек вместе с ключами, поменяли DNS).

service:
  # Сервисный туннель к нам: только управление MikroTik (ssh, winbox) и обновления.
  # Видео и телеметрия по нему не идут. Включается у робота флагом service_tunnel.
  host: ops.flu.example.com          # куда деплоить (ssh)
  ssh_user: root
  endpoint: ops.flu.example.com:51900
  network: 10.99.0.0/16              # .0.1 — сервер, инженер с id K — .0.(1 + K), робот — по глобальному id
  engineers:
    - {name: engineer1, id: 1}

sites:
  # Сценарий 1: наш VPS, отдельный экземпляр стека под заказчика
  flu-acme:
    kind: managed
    customer: ACME
    host: vps1.flu.example.com
    ssh_user: root
    endpoint: acme.vpn.flu.example.com:51821
    network:
      tunnel: 10.150.0.0/24
      operators: 10.150.1.0/24
      robot_lans: 10.150.16.0/20

  # Сценарий 2: VPS заказчика, стек ставим и обслуживаем мы
  globex:
    kind: managed
    customer: Globex
    host: robots.globex.example.com
    ssh_user: root
    endpoint: robots.globex.example.com:51820
    network:
      tunnel: 10.160.0.0/24
      operators: 10.160.1.0/24
      robot_lans: 10.160.16.0/20

  # Сценарий 3: свой сервер заказчика, только туннель
  initech:
    kind: external
    customer: Initech
    vpn: wireguard
    endpoint: vpn.initech.example.com:51820
    server_pubkey: "dGVzdC1rZXktcmVwbGFjZS13aXRoLWN1c3RvbWVycyE="   # пример: заменить ключом сервера заказчика
    server_ip: 172.20.5.1               # адрес сервера заказчика в туннеле
    allowed_sources: [172.20.5.1]       # кому робот разрешает MAVLink и RTSP
    network:
      tunnel: 172.20.5.0/26
      robot_lans: 172.20.5.64/26
