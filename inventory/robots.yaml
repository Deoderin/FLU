# НРК (наземні роботизовані комплекси).
#   id       — глобальний номер НРК (як на шильдику), ніколи не змінюється
#   serial   — заводський номер
#   platform — ревізія заліза з base/platforms.yaml
#   site     — майданчик із sites.yaml
#   slot     — номер НРК на майданчику, він же MAVLink SYSID.
#              Заповнює fleet (provision / move), руками не чіпати.
#   service_tunnel — другий тунель до нас для обслуговування (потрібна згода замовника)
#
# НРК додає майстер першого налаштування (fleet setup --serial ...) або людина вручну.
# Запис виглядає так (технічне ім'я буде nrk-001):
#
#   - id: 1
#     serial: FLU-2026-0001
#     platform: flu-v1
#     site: main
#     service_tunnel: false
robots:
  - id: 1
    serial: bort-1
    platform: flu-v1
    site: main
    slot: 1
    service_tunnel: false
  - id: 2
    serial: '4545511'
    platform: flu-v1
    site: main
    slot: 2
    service_tunnel: false
