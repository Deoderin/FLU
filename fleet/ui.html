<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UGV Quick Setup · advanced</title>
<style>
  :root {
    --bg: #f3f4f6; --panel: #ffffff; --fg: #1a1f28; --muted: #687083; --line: #e1e4ea; --soft: #f0f2f5;
    --accent: #2357d4; --accent-fg: #ffffff; --ok: #1d8348; --warn: #a66300; --bad: #c0392b;
    --console-bg: #11151c; --console-fg: #d7dde8; --h: 32px; --r: 8px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111419; --panel: #191d25; --fg: #e5e8ee; --muted: #9aa2b3; --line: #2a303b; --soft: #212732;
      --accent: #6f93ff; --accent-fg: #0c1120; --ok: #4cc38a; --warn: #e2a33c; --bad: #ef6a5b;
      --console-bg: #0b0e13; --console-fg: #d7dde8;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  button, select, input { font: inherit; color: inherit; }
  button { height: var(--h); padding: 0 14px; border-radius: var(--r); border: 1px solid var(--line); background: var(--panel);
           cursor: pointer; white-space: nowrap; display: inline-flex; align-items: center; justify-content: center; }
  button:hover:not(:disabled) { background: var(--soft); }
  button:disabled { opacity: .45; cursor: default; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); font-weight: 600; }
  button.primary:hover:not(:disabled) { background: var(--accent); filter: brightness(1.08); }
  button.danger { color: var(--bad); border-color: var(--bad); }
  select, input[type=text], input[type=password] { height: var(--h); padding: 0 10px; border-radius: var(--r);
           border: 1px solid var(--line); background: var(--panel); min-width: 0; width: 100%; }
  a { color: var(--accent); }
  .muted { color: var(--muted); }
  .ok { color: var(--ok); } .warn { color: var(--warn); } .bad { color: var(--bad); }
  .hidden { display: none !important; }

  /* шапка */
  .top { position: sticky; top: 0; z-index: 2; background: var(--panel); border-bottom: 1px solid var(--line); }
  .top-inner { max-width: 1360px; margin: 0 auto; padding: 10px 20px; display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; }
  .brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; margin-right: auto; white-space: nowrap; }
  .brand b { font-size: 16px; }
  .brand .muted { font-size: 12px; overflow: hidden; text-overflow: ellipsis; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .badge { display: inline-flex; align-items: center; height: 22px; padding: 0 9px; border-radius: 99px; font-size: 12px;
           border: 1px solid currentColor; white-space: nowrap; }
  .lang { display: inline-flex; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
  .lang button { border: 0; border-radius: 0; height: calc(var(--h) - 2px); padding: 0 10px; font-size: 12.5px; font-weight: 600; color: var(--muted); }
  .lang button.on { background: var(--accent); color: var(--accent-fg); }

  .banner { max-width: 1360px; margin: 14px auto 0; padding: 10px 14px; border-radius: var(--r); border: 1px solid var(--bad);
            color: var(--bad); background: var(--panel); }
  .banner ul { margin: 4px 0 0; padding-left: 18px; }

  /* розкладка */
  .layout { max-width: 1360px; margin: 0 auto; padding: 20px; display: grid; grid-template-columns: minmax(0, 1fr) 420px; gap: 20px; }
  main { display: grid; grid-template-columns: minmax(0, 1fr); gap: 24px; align-content: start; min-width: 0; }
  .section-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; height: 28px; margin-bottom: 10px; }
  h2 { margin: 0; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 700; }
  @media (max-width: 1060px) { .layout { grid-template-columns: minmax(0, 1fr); } }
  @media (max-width: 600px) { .layout { padding: 12px; } .top-inner { padding: 10px 12px; } }

  /* майданчики */
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: flex; flex-direction: column; gap: 4px; }
  .card-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 4px; }
  .card-head b { font-size: 15px; overflow: hidden; text-overflow: ellipsis; }
  .card .meta { font-size: 12.5px; color: var(--muted); overflow-wrap: anywhere; }
  .card .actions { display: flex; gap: 8px; margin-top: auto; padding-top: 10px; }

  /* таблиця НРК */
  .table-wrap { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-weight: 600; font-size: 12px; color: var(--muted); padding: 10px 14px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  td { padding: 10px 14px; border-bottom: 1px solid var(--line); vertical-align: middle; white-space: nowrap; }
  td.num, th.num { text-align: center; }
  tbody tr { cursor: pointer; }
  tbody tr:hover td, tbody tr.selected td { background: var(--soft); }
  tbody tr.selected td:first-child { box-shadow: inset 3px 0 0 var(--accent); }
  tbody tr:last-child td { border-bottom: 0; }
  .ugv b { display: block; }
  .ugv .muted { font-size: 12px; }
  .empty { color: var(--muted); padding: 28px 16px; text-align: center; white-space: normal; }

  /* консоль */
  .console { background: var(--console-bg); color: var(--console-fg); border-radius: 10px; overflow: hidden; }
  .console-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 14px;
                  border-bottom: 1px solid rgba(255,255,255,.08); font: 12.5px ui-monospace, Consolas, monospace; min-height: 44px; }
  .console-head .cmd { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .console-head button { height: 26px; background: transparent; color: #ff8a80; border-color: #ff8a80; }
  .console pre { margin: 0; padding: 12px 14px; min-height: 120px; max-height: 360px; overflow: auto;
                 font: 12.5px/1.5 ui-monospace, Consolas, monospace; white-space: pre-wrap; }

  /* панель НРК */
  aside { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; align-self: start;
          position: sticky; top: 72px; max-height: calc(100vh - 92px); overflow: auto; }
  @media (max-width: 1060px) { aside { position: static; max-height: none; } }
  .detail-head { padding: 14px 16px; border-bottom: 1px solid var(--line); display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
  .detail-head b { font-size: 18px; }
  .step { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
  .step:last-child { border-bottom: 0; }
  .step.plain { grid-template-columns: minmax(0, 1fr); }
  .dot { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 700;
         background: var(--soft); color: var(--muted); }
  .dot.done { background: var(--ok); color: #fff; }
  .dot.failed { background: var(--bad); color: #fff; }
  .step-title { font-weight: 600; line-height: 26px; }
  .note { font-size: 12.5px; color: var(--muted); margin-bottom: 10px; overflow-wrap: anywhere; }
  .controls { display: grid; gap: 8px; }
  .line { display: flex; gap: 8px; align-items: center; }
  .line > input, .line > select { flex: 1 1 auto; }
  .line > button { flex: 0 0 auto; }
  .reveal { font: 13px ui-monospace, Consolas, monospace; }
  .check { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; font-size: 13px; color: var(--muted); }
  .checks { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 4px; font-size: 12.5px; }
  .checks li { display: grid; grid-template-columns: 46px minmax(0, 1fr); gap: 6px; }
  .checks .detail { color: var(--muted); overflow-wrap: anywhere; }
  .files { display: flex; flex-wrap: wrap; gap: 6px; }
  .files button { height: 28px; font: 12px ui-monospace, Consolas, monospace; }

  dialog { width: min(920px, calc(100vw - 32px)); max-height: calc(100vh - 64px); padding: 0; border: 1px solid var(--line);
           border-radius: 10px; background: var(--panel); color: var(--fg); }
  dialog::backdrop { background: rgba(0, 0, 0, .45); }
  dialog header { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: 1px solid var(--line); }
  dialog pre { margin: 0; padding: 14px; overflow: auto; max-height: calc(100vh - 140px); font: 12.5px/1.5 ui-monospace, Consolas, monospace; }
</style>
</head>
<body>
<header class="top">
  <div class="top-inner">
    <div class="brand"><b>UGV Quick Setup</b><span class="muted" id="root"></span></div>
    <div class="bar">
      <a id="simple-link" href="/"></a>
      <span id="inv-status" class="badge muted"></span>
      <button id="btn-check" data-cmd onclick="run(['check'])"></button>
      <button id="btn-render" data-cmd onclick="run(['render'])"></button>
      <div class="lang" role="group" aria-label="Language">
        <button data-lang="uk" onclick="setLang('uk')">UK</button>
        <button data-lang="en" onclick="setLang('en')">EN</button>
      </div>
    </div>
  </div>
</header>
<div id="errors" class="banner hidden"></div>

<div class="layout">
  <main>
    <section>
      <div class="section-head"><h2 id="h-sites"></h2></div>
      <div id="sites" class="cards"></div>
    </section>
    <section>
      <div class="section-head"><h2 id="h-ugvs"></h2></div>
      <div class="table-wrap">
        <table>
          <thead><tr id="robots-head"></tr></thead>
          <tbody id="robots"></tbody>
        </table>
      </div>
    </section>
    <section>
      <div class="section-head"><h2 id="h-console"></h2></div>
      <div class="console">
        <div class="console-head">
          <span class="cmd" id="job-cmd"></span>
          <span class="bar"><span id="job-status"></span><button id="stop" class="hidden" onclick="stopJob()"></button></span>
        </div>
        <pre id="console"></pre>
      </div>
    </section>
  </main>
  <aside id="detail"></aside>
</div>

<dialog id="viewer">
  <header><b id="viewer-title"></b><button id="viewer-close" onclick="document.getElementById('viewer').close()"></button></header>
  <pre id="viewer-body"></pre>
</dialog>

    run_test: "Запустити тест", no_mikrotik: "без MikroTik",
    move: "Переїзд на інший майданчик", move_note: "новий тунель піднімається поруч зі старим; без handshake — автовідкат",

    close: "Закрити", no_connection: "немає зв'язку з fleet ui",

           dev_cam1: "передня камера на борту", dev_cam2: "задня камера на борту", dev_fc: "адаптер ФК на борту" },

           mikrotik_config: "MikroTik: config", site_tunnel: "site tunnel", mikrotik_drift: "MikroTik: drift", lte: "LTE",

};

let lang = "uk";
try { lang = localStorage.getItem("fleet-lang") || "uk"; } catch (e) {}
const t = (key, vars = {}) => (I18N[lang][key] ?? I18N.uk[key] ?? key).replace(/\{(\w+)\}/g, (_, k) => vars[k] ?? "");

const h = (tag, attrs = {}, ...children) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "value") el.value = v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const c of children.flat()) if (c != null && c !== false) el.append(c);
  return el;
};

let state = null;
let selected = Number((location.hash.match(/robot-(\d+)/) || [])[1]) || null;
let polling = null;
const inputs = {};  // введені значення переживають перемальовування

async function api(path, body) {
  const headers = { "X-Lang": lang };
  const options = body === undefined ? { headers } : {
    method: "POST", headers: { ...headers, "Content-Type": "application/json", "X-Fleet": "1" }, body: JSON.stringify(body),
  };
  const r = await fetch(path, options);
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || `HTTP ${r.status}`);
  return data;
}

function setLang(next) {
  lang = next;
  try { localStorage.setItem("fleet-lang", lang); } catch (e) {}
  refresh(true);
}

// --- команди -------------------------------------------------------------------

const busy = () => Boolean(state && state.job && state.job.running);

async function run(args) {
  try {
    showJob(await api("/api/run", { args }));
    pollJob();
  } catch (e) {
    alert(e.message);
  }
}

async function stopJob() {
  await api("/api/stop", {});
}

function pollJob() {
  clearTimeout(polling);
  polling = setTimeout(async () => {
    if (!state || !state.job) return;
    const job = await api(`/api/jobs/${state.job.id}`);
    showJob(job);
    if (job.running) pollJob();
    else refresh(true);
  }, 700);
}

function showJob(job) {
  if (!state) state = {};
  state.job = job;
  const con = document.getElementById("console");
  const status = document.getElementById("job-status");
  if (!job) {
    document.getElementById("job-cmd").textContent = t("console_idle");
    con.textContent = t("console_empty");
    status.textContent = "";
    document.getElementById("stop").classList.add("hidden");
    return;
  }
  const atBottom = con.scrollHeight - con.scrollTop - con.clientHeight < 40;
  document.getElementById("job-cmd").textContent = "$ " + job.command;
  con.textContent = job.output || "…";
  if (atBottom || job.running) con.scrollTop = con.scrollHeight;
  if (job.running) { status.textContent = t("running", { s: job.seconds }); status.className = "warn"; }
  else if (job.code === 0) { status.textContent = t("done"); status.className = "ok"; }
  else { status.textContent = t("failed", { code: job.code }); status.className = "bad"; }
  document.getElementById("stop").classList.toggle("hidden", !job.running);
  document.querySelectorAll("[data-cmd]").forEach((b) => (b.disabled = job.running || b.hasAttribute("data-off")));
}

function cmd(label, args, opts = {}) {
  return h("button", {
    class: opts.primary ? "primary" : opts.danger ? "danger" : null,
    "data-cmd": "", "data-off": opts.disabled || null, disabled: opts.disabled || busy(),
    title: typeof args === "function" ? null : "fleet " + args.join(" "),
    onclick: () => {
      const a = typeof args === "function" ? args() : args;
      if (!a) return;
      if (opts.confirm && !confirm(opts.confirm)) return;
      run(a);
    },
  }, label);
}

async function viewFile(path) {
  const r = await fetch(`/api/file?path=${encodeURIComponent(path)}`, { headers: { "X-Lang": lang } });
  document.getElementById("viewer-title").textContent = path;
  document.getElementById("viewer-body").textContent = await r.text();
  document.getElementById("viewer").showModal();
}

// --- відмальовування -----------------------------------------------------------

function renderChrome() {
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-lang]").forEach((b) => b.classList.toggle("on", b.dataset.lang === lang));
  document.getElementById("simple-link").textContent = t("simple_mode");
  document.getElementById("btn-check").textContent = t("check");
  document.getElementById("btn-render").textContent = t("render_all");
  document.getElementById("h-sites").textContent = t("sites");
  document.getElementById("h-ugvs").textContent = t("ugvs");
  document.getElementById("h-console").textContent = t("console");
  document.getElementById("stop").textContent = t("stop");
  document.getElementById("viewer-close").textContent = t("close");
  document.getElementById("robots-head").replaceChildren(
    h("th", {}, t("col_ugv")), h("th", {}, t("col_site")), h("th", { class: "num" }, t("col_slot")),
    h("th", {}, t("col_service")), h("th", {}, t("col_mikrotik")), h("th", {}, t("col_test")));
}

function renderHeader() {
  const root = document.getElementById("root");
  root.textContent = state.root.split(/[\\/]/).filter(Boolean).pop() || state.root;
  root.title = state.root;
  const chip = document.getElementById("inv-status");
  const banner = document.getElementById("errors");
  const errors = state.fatal ? [state.fatal] : state.errors;
  chip.textContent = errors.length ? t("inv_errors", { n: errors.length }) : t("inv_ok");
  chip.className = "badge " + (errors.length ? "bad" : "ok");
  banner.classList.toggle("hidden", !errors.length);
  banner.replaceChildren(h("b", {}, t("inv_errors_title")), h("ul", {}, errors.map((e) => h("li", {}, e))));
}

function siteCard(s) {
  const managed = s.kind === "managed";
  const hub = s.kind === "hub";
  const actions = hub
    ? h("a", { href: "/" }, t("simple_mode"))
    : managed
      ? [cmd(t("deploy"), ["deploy-server", "--site", s.name], { primary: true, confirm: t("confirm_deploy", { site: s.name, host: s.host }) }),
         cmd(t("build"), ["render", "--site", s.name], { disabled: !s.has_key })]
      : cmd(t("connection_files"), ["kit", "--site", s.name], { primary: true });
  return h("div", { class: "card" },
    h("div", { class: "card-head" },
      h("b", {}, s.name), h("span", { class: "badge muted" }, t(`kind_${s.kind}`))),
    h("div", { class: "meta" }, [s.customer, s.has_key || !hub ? s.endpoint : null].filter(Boolean).join(" · ")),
    h("div", { class: "meta" }, t("ugvs_count", { n: s.robots, cap: s.capacity }) + (managed || hub ? " · " + t("operators_count", { n: s.operators.length }) : "")),
    managed && (s.has_key
      ? h("div", { class: "meta" }, t("panel") + ": ", h("a", { href: s.panel, target: "_blank" }, s.panel))
      : h("div", { class: "meta warn" }, t("not_deployed"))),
    hub && h("div", { class: "meta " + (s.has_key ? "" : "warn") }, s.has_key ? t("hub_ready") : t("hub_pending")),
    h("div", { class: "actions" }, actions));
}

function renderSites() {
  const cards = state.sites.map(siteCard);
  if (state.service) {
    const svc = state.service;
    cards.push(h("div", { class: "card" },
      h("div", { class: "card-head" }, h("b", {}, t("service_tunnel")), h("span", { class: "badge muted" }, t("service_badge"))),
      h("div", { class: "meta" }, svc.endpoint),
      h("div", { class: "meta " + (svc.has_key ? "" : "warn") }, svc.has_key ? t("key_present") : t("not_deployed")),
      h("div", { class: "actions" }, cmd(t("deploy"), ["deploy-server", "--service"], { confirm: t("confirm_deploy_svc", { host: svc.host }) }))));
  }
  document.getElementById("sites").replaceChildren(...cards);
}

function reportCell(rep) {
  if (!rep) return h("span", { class: "muted" }, t("never"));
  const cls = rep.fail ? "bad" : rep.warn ? "warn" : "ok";
  const text = rep.fail ? `FAIL ${rep.fail}` : rep.warn ? `WARN ${rep.warn}` : t("passed");
  return h("span", { class: "bar" }, h("span", { class: "badge " + cls }, text), h("span", { class: "muted" }, rep.time));
}

function renderRobots() {
  const body = document.getElementById("robots");
  if (!state.robots.length) {
    body.replaceChildren(h("tr", {}, h("td", { colspan: 6, class: "empty" }, t("empty_ugvs"))));
    return;
  }
  body.replaceChildren(...state.robots.map((r) => h("tr", {
      class: r.id === selected ? "selected" : null,
      onclick: () => { selected = r.id; location.hash = `robot-${r.id}`; render(); },
    },
    h("td", { class: "ugv" }, h("b", {}, r.name), h("span", { class: "muted" }, r.serial)),
    h("td", {}, r.site || "—", !r.provisioned && h("div", { class: "warn" }, t("not_registered"))),
    h("td", { class: "num" }, r.slot ?? "—"),
    h("td", {}, r.service_tunnel ? t("yes") : h("span", { class: "muted" }, t("no"))),
    h("td", {}, r.baseline ? h("span", { class: "badge ok" }, t("flashed")) : h("span", { class: "muted" }, "—")),
    h("td", {}, reportCell(r.report)))));
}

function checkStatus(rep, ...keys) {
  if (!rep) return null;
  const found = rep.checks.filter((c) => keys.includes(c.key));
  if (!found.length) return null;
  if (found.some((c) => c.status === "FAIL")) return "failed";
  return found.every((c) => c.status === "PASS") ? "done" : null;
}

function step(n, status, title, note, ...controls) {
  return h("div", { class: "step" },
    h("div", { class: "dot " + (status || "") }, status === "done" ? "✓" : status === "failed" ? "!" : String(n)),
    h("div", {}, h("div", { class: "step-title" }, title), note && h("div", { class: "note" }, note),
      h("div", { class: "controls" }, ...controls)));
}

function field(key, attrs) {
  const el = h("input", { type: "text", ...attrs, value: inputs[key] ?? attrs.value ?? "" });
  el.addEventListener("input", () => (inputs[key] = el.value));
  return el;
}

function renderDetail() {
  const aside = document.getElementById("detail");
  const r = state.robots.find((x) => x.id === selected);
  if (!r) { aside.replaceChildren(h("div", { class: "empty" }, t("select_ugv"))); return; }
  const id = String(r.id);
  const site = state.sites.find((s) => s.name === r.site);
  const managed = site && site.kind === "managed";
  const hub = site && site.kind === "hub";
  const rep = r.report;
  const off = !r.provisioned;

  const siteSelect = h("select", {}, state.sites.map((s) => h("option", { value: s.name, selected: s.name === r.site }, s.name)));
  const s1 = step(1, r.provisioned ? "done" : null, t("step1"),
    r.provisioned ? t("step1_done", { site: r.site, slot: r.slot }) : t("step1_todo"),
    h("div", { class: "line" }, !r.provisioned && siteSelect,
      cmd(r.provisioned ? t("rebuild") : t("register"),
        () => r.provisioned ? ["provision", "--id", id] : ["provision", "--id", id, "--site", siteSelect.value], { primary: !r.provisioned })));

  const s2 = step(2, r.baseline ? "done" : null, t("step2"), r.baseline ? t("step2_done") : t("step2_todo"),
    h("div", { class: "line" },
      field(`pwd-${id}`, { type: "password", placeholder: t("pwd_placeholder") }),
      cmd(t("flash"), () => ["bench", "mikrotik", "--id", id, "--password", inputs[`pwd-${id}`] || ""],
        { disabled: off, primary: r.provisioned && !r.baseline, confirm: t("confirm_flash") })));

  const pwdBox = h("span", { class: "reveal" });
  const s3 = step(3, checkStatus(rep, "cam1", "cam2"), t("step3"), t("step3_note"),
    h("div", { class: "line" },
      h("button", { disabled: off, onclick: async () => {
        try { pwdBox.textContent = (await api(`/api/camera-password?id=${id}`)).password; } catch (e) { pwdBox.textContent = e.message; }
      } }, t("show_pwd")), pwdBox),
    h("div", { class: "line" }, cmd(t("cameras_move"), ["bench", "cameras", "--id", id], { disabled: off })));

  const options = state.ports.map((p) => ({ value: p.device, label: `${p.device} — ${p.description}` }));
  if (r.mavlink) options.push({ value: r.mavlink, label: `${t(hub ? "via_tunnel" : "via_arbiter")} (${r.mavlink})` });
  const conn = field(`conn-${id}`, { placeholder: t("conn_placeholder"), list: `ports-${id}`, value: options[0]?.value || "" });
  const s4 = step(4, checkStatus(rep, "params"), t("step4"), t("step4_note"),
    h("datalist", { id: `ports-${id}` }, options.map((o) => h("option", { value: o.value }, o.label))),
    conn,
    h("div", { class: "line" },
      cmd(t("compare"), () => conn.value && ["fc", "--id", id, "--connect", conn.value], { disabled: off }),
      cmd(t("write_reboot"), () => conn.value && ["fc", "--id", id, "--connect", conn.value, "--push", "--yes", "--reboot"],
        { disabled: off, confirm: t("confirm_write") })));

  const s5 = step(5, managed ? checkStatus(rep, "arbiter") : null, t("step5"),
    !site ? t("step5_none") : hub ? t("step5_hub") : managed ? t("step5_managed", { host: site.host }) : t("step5_external"),
    site && h("div", { class: "line" }, hub
      ? h("a", { href: "/" }, t("simple_mode"))
      : managed
        ? cmd(t("deploy_site", { site: site.name }), ["deploy-server", "--site", site.name], { disabled: off, confirm: t("confirm_update", { site: site.name }) })
        : cmd(t("connection_files"), ["kit", "--site", site.name], { disabled: off })));

  const noMt = h("input", { type: "checkbox" });
  const s6 = step(6, rep ? (rep.fail ? "failed" : "done") : null, t("step6"),
    rep ? t("step6_last", { time: rep.time }) : t("step6_todo"),
    h("div", { class: "line" },
      cmd(t("run_test"), () => ["test", "--id", id, ...(noMt.checked ? ["--no-mikrotik"] : [])], { primary: true, disabled: off }),
      h("label", { class: "check" }, noMt, t("no_mikrotik"))),
    rep && h("ul", { class: "checks" }, rep.checks.map((c) => h("li", {},
      h("span", { class: c.status === "PASS" ? "ok" : c.status === "FAIL" ? "bad" : c.status === "WARN" ? "warn" : "muted" },
        c.status === "PASS" ? "OK" : c.status),
      h("span", {}, I18N[lang].chk[c.key] || c.name, c.detail && h("div", { class: "detail" }, c.detail))))));

  const targets = state.sites.filter((s) => s.name !== r.site);
  const target = h("select", {}, targets.map((s) => h("option", { value: s.name }, s.name)));
  const move = h("div", { class: "step plain" },
    h("div", {}, h("div", { class: "step-title" }, t("move")), h("div", { class: "note" }, t("move_note")),
      h("div", { class: "line" }, target,
        cmd(t("move_btn"), () => ["move", "--id", id, "--to", target.value, "--yes"],
          { disabled: off || !targets.length, confirm: t("confirm_move", { name: r.name, site: target.value }) }))));
  const files = h("div", { class: "step plain" },
    h("div", {}, h("div", { class: "step-title" }, t("files")),
      r.files.length
        ? h("div", { class: "files" }, r.files.map((f) => h("button", { onclick: () => viewFile(f) }, f.split("/").pop())))
        : h("div", { class: "note" }, t("files_none"))));

  aside.replaceChildren(
    h("div", { class: "detail-head" }, h("b", {}, r.name), h("span", { class: "muted" }, `${r.serial} · ${r.platform}`)),
    s1, s2, s3, s4, s5, s6, move, files);
}

function render() {
  renderChrome();
  renderHeader();
  renderSites();
  renderRobots();
  renderDetail();
  showJob(state.job);
}

async function refresh(force = false) {
  try {
    // Не перемальовуємо сторінку під рукою: людина саме щось вводить
    const active = document.activeElement;
    const typing = active && (active.tagName === "SELECT" || (active.tagName === "INPUT" && active.type !== "checkbox"));
    if (typing && !force) return;
    state = await api("/api/state");
    if (!selected && state.robots.length) selected = state.robots[0].id;
    render();
    if (busy()) pollJob();
  } catch (e) {
    renderChrome();
    const chip = document.getElementById("inv-status");
    chip.textContent = t("no_connection");
    chip.className = "badge bad";
  }
}

window.addEventListener("hashchange", () => {
  selected = Number((location.hash.match(/robot-(\d+)/) || [])[1]) || null;
  if (state) render();
});

renderChrome();
refresh();
setInterval(refresh, 10000);
</script>
</body>
</html>
